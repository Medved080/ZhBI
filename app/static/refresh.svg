<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Обновить">
  <!-- Значок обновления данных: два дугообразных стрелки, образующие круг.
       Вторая — та же фигура, повёрнутая на 180°, поэтому симметрия точная
       и правится в одном месте. Векторный, а не PNG: на кнопке 28 px
       растровая картинка мылится. -->
  <g fill="#ED1C24">
    <path id="zhbi-refresh-arrow" d="M 9.16 46.43 A 41.0 41.0 0 0 1 88.53 35.98 L 98.86 32.21 L 83.96 58.47 L 66.91 43.84 L 77.25 40.08 A 29.0 29.0 0 0 0 21.11 47.47 Z"/>
    <use href="#zhbi-refresh-arrow" transform="rotate(180 50.0 50.0)"/>
  </g>
</svg>
